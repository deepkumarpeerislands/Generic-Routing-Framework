UserPayload:
  type: object
  required:
    - name
    - email
    - age
    - eligible
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: The user's full name
      example: "John Doe"
    email:
      type: string
      format: email
      description: The user's email address
      example: "john.doe@example.com"
    age:
      type: integer
      minimum: 18
      maximum: 120
      description: The user's age
      example: 30
    eligible:
      type: boolean
      description: Whether the user is eligible
      example: true

UserResponse:
  type: object
  description: Generic response for user entity
  properties:
    id:
      type: string
      description: Unique identifier
      example: "12345"
    entity:
      type: string
      example: "users"
    payload:
      type: object
      additionalProperties: true
    createdAt:
      type: string
      format: date-time
      description: Creation timestamp


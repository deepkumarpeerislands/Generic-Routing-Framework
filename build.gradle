plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.12'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.aciworldwide'
version = '0.0.1-SNAPSHOT'
description = 'Generic APIs'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	
	// Jackson JDK8 module for Optional support
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8'
	
	// Vert.x dependencies
	implementation 'io.vertx:vertx-core:4.5.9'
	implementation 'io.vertx:vertx-web:4.5.9'
	implementation 'io.vertx:vertx-web-client:4.5.9'
	implementation 'io.vertx:vertx-web-openapi:4.5.9'
	implementation 'io.vertx:vertx-web-validation:4.5.9'
	implementation 'io.vertx:vertx-json-schema:4.5.9'
	
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.vertx:vertx-junit5:4.5.9'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
